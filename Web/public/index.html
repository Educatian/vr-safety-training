<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Competent Person · Construction Safety</title>
<meta name="description" content="A construction-safety serious game: one week as the competent person on an Alabama jobsite.">
<style>
  html, body { margin:0; height:100%; background:#0b0d0e; overflow:hidden; font-family: "Barlow Condensed", system-ui, sans-serif; }
  #unity-canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; background:#0b0d0e; outline:none; }
  #boot { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
          color:#e8ecea; background: radial-gradient(ellipse at 50% 40%, #1b2124 0%, #0b0d0e 70%); z-index:2; transition: opacity .5s; }
  #boot h1 { margin:0; font-size:clamp(34px, 6vw, 68px); letter-spacing:.04em; color:#ffc61a; font-weight:700; }
  #boot p { margin:0; color:#9aa6a3; font-size:clamp(15px, 2vw, 20px); text-align:center; max-width:620px; padding:0 16px; }
  #bar { width:min(460px, 80vw); height:8px; background:#1f2629; border-radius:4px; overflow:hidden; }
  #fill { height:100%; width:0; background:#ffc61a; transition: width .2s; }
  #start { display:none; padding:14px 34px; font:inherit; font-size:22px; font-weight:700; letter-spacing:.05em; border:0; border-radius:6px;
           background:#ffc61a; color:#111; cursor:pointer; }
  #fs { position:fixed; right:12px; bottom:12px; z-index:3; background:rgba(0,0,0,.45); color:#fff; border:1px solid rgba(255,255,255,.25);
        border-radius:6px; padding:6px 10px; font:inherit; font-size:15px; cursor:pointer; display:none; }
  #err { color:#ff8a7a; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="boot">
  <h1>COMPETENT PERSON</h1>
  <p>One week on the Loblolly Creek Lift Station, Autauga County, Alabama.</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="msg">Loading the jobsite…</p>
  <button id="start">ENTER THE SITE</button>
</div>
<button id="fs" title="Full screen">Full screen</button>
<script>
  const canvas = document.getElementById("unity-canvas");
  const fill = document.getElementById("fill"), msg = document.getElementById("msg"), start = document.getElementById("start"), boot = document.getElementById("boot"), fs = document.getElementById("fs");
  // Cap the render resolution on HiDPI screens so laptops/Chromebooks keep a steady frame rate.
  const config = {
    dataUrl: "Build/WebGL.data.unityweb",
    frameworkUrl: "Build/WebGL.framework.js.unityweb",
    codeUrl: "Build/WebGL.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "ADIE Lab", productName: "Competent Person", productVersion: "0.2",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
    matchWebGLToCanvasSize: true,
    autoSyncPersistentDataPath: true,
  };
  const s = document.createElement("script");
  s.src = "Build/WebGL.loader.js";
  s.onload = () => createUnityInstance(canvas, config, (p) => { fill.style.width = Math.round(p * 100) + "%"; })
    .then(() => { msg.textContent = "Ready. Use headphones if you can."; document.getElementById("bar").style.display = "none"; start.style.display = "block"; })
    .catch((e) => { msg.id = "err"; msg.textContent = "Could not start: " + e; });
  document.body.appendChild(s);
  // A click is needed anyway for sound in browsers; it also focuses the game.
  start.onclick = () => { boot.style.opacity = 0; setTimeout(() => boot.remove(), 500); fs.style.display = "block"; canvas.focus(); };
  fs.onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
</script>
</body>
</html>
